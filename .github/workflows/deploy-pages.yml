name: Deploy web app to GitHub Pages

# Actions are pinned to commit SHAs, not tags. A tag like @v4 is mutable — if it
# were ever repointed, the new code would run in a job that holds this repo's
# secrets. The trailing comment records which release each SHA is, so bumping
# one means updating both. Same major versions as before; SHAs only.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export static web build
        run: npx expo export --platform web
        env:
          # Empty until the repo secrets exist (supabase/README.md step 4) —
          # the app hides all account UI when these are blank.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Add SPA fallback, custom domain, and disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          # Keep the custom domain attached on every Actions deploy — without a
          # CNAME in the artifact, GitHub can drop the domain setting.
          echo 'selftapebuddy.com' > dist/CNAME

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
